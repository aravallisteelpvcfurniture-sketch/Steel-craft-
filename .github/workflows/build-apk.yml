name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also attempt Release build (if keystore secrets configured)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Export APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Key and Environment
        run: |
          # Create .env from .env.example if not present
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Decode debug keystore if tracked as base64, otherwise generate default debug keystore
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fresh debug.keystore..."
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Grant execution rights for gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename Debug APK with Timestamp
        run: |
          TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/SteelCraft-Pro-Debug-${TIMESTAMP}.apk
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/SteelCraft-Pro-Debug-latest.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelCraft-Pro-Debug-APK
          path: apk-output/*.apk
          retention-days: 30

      - name: Build Release APK (Optional)
        id: release_build
        if: ${{ inputs.build_release == true || startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Keystore secrets detected, assembling Release APK..."
            ./gradlew :app:assembleRelease --stacktrace
            cp app/build/outputs/apk/release/*.apk apk-output/ || true
          else
            echo "No release signing secrets provided, skipping Release build."
          fi

      - name: Publish GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
