name: Build Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Attempt Release APK build if keystore secrets are configured'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Accept Android SDK Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Prepare Android Keystore and Environment
        run: |
          echo "Setting up environment configuration..."
          chmod +x ./gradlew || true

          # Ensure .env file exists for Secrets Gradle Plugin
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Ensure debug.keystore is present
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

          if [ ! -s debug.keystore ]; then
            echo "Generating fresh android debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure app/google-services.json is present
          if [ ! -f app/google-services.json ]; then
            echo "Generating default app/google-services.json..."
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "171461343612",
    "project_id": "gen-lang-client-0415886588",
    "storage_bucket": "gen-lang-client-0415886588.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:171461343612:android:7d88403526e38e6c0c0cf9",
        "android_client_info": {
          "package_name": "com.aistudio.steelcraft.kmwpxz"
        }
      },
      "oauth_client": [
        {
          "client_id": "171461343612-ov5keclpdhs1tr9i7k5htd94mkdeigid.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyDulAQs9Ms0m8dT2eRq-m6OKx1PQ56m1yI"
        }
      ]
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

          # If gradle-wrapper.jar was not committed, generate wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper JAR missing, generating wrapper..."
            gradle wrapper || true
          fi

      - name: Build Debug APK
        run: |
          echo "Starting Debug APK build with Gradle..."
          chmod +x ./gradlew || true
          ./gradlew :app:assembleDebug -x test -x lint --stacktrace --no-daemon

      - name: Prepare APK Outputs
        run: |
          mkdir -p apk-output
          # Copy all generated APKs
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} apk-output/ \;
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk apk-output/SteelCraft-Pro-debug.apk
          fi
          echo "=== APK OUTPUTS ==="
          ls -lh apk-output/

      - name: Build Release APK (Optional)
        if: ${{ inputs.build_release == true || startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Release keystore secrets found, building Release APK..."
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
            if [ -d "app/build/outputs/apk/release" ]; then
              cp app/build/outputs/apk/release/*.apk apk-output/ 2>/dev/null || true
            fi
          else
            echo "Release signing secrets not configured. Skipping Release build."
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelCraft-Pro-APK
          path: apk-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release (On Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apk-output/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Job Summary
        run: |
          APK_SIZE=$(ls -lh apk-output/SteelCraft-Pro-debug.apk | awk '{print $5}')
          echo "### 🚀 APK Build Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **App Name** | SteelCraft Pro |" >> $GITHUB_STEP_SUMMARY
          echo "| **Package ID** | com.aistudio.steelcraft.kmwpxz |" >> $GITHUB_STEP_SUMMARY
          echo "| **File Size** | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| **Artifact** | [Download SteelCraft-Pro-APK from Artifacts section below] |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the **SteelCraft-Pro-APK** artifact below to install on your Android device." >> $GITHUB_STEP_SUMMARY
